<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070816">
<meta name="description" content="Paradixe, un mundo 3D compartido para recorrer con otras personas.">
<title>Plaza Paradixe</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Chakra+Petch:wght@500;600&family=DM+Sans:wght@400;500&display=swap">
<style>
/* Layout: ciudad 3D a pantalla completa. Radar y zona arriba a la izquierda, marca y conectados arriba a la derecha, controles táctiles abajo. */
:root {
  --bg: #0c0b1e;
  --ink: #f6efe4;
  --muted: #c2b8cc;
  --accent: #ffb347;
  --portal: #4fe3ff;
  --panel: rgba(16, 12, 36, 0.62);
  --line: rgba(246, 239, 228, 0.26);
  --font-title: "Bebas Neue", "Arial Narrow", Impact, sans-serif;
  --font-display: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; background: var(--bg); }
#vignette {
  position: fixed; inset: 0; pointer-events: none;
  background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 52%, rgba(8, 4, 20, 0.5) 100%);
}

#top, #bottom {
  position: fixed; left: 0; right: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  pointer-events: none;
  display: flex; justify-content: space-between; gap: 12px;
}
#top { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); align-items: flex-start; }
#bottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); align-items: flex-end; }

.left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
#radar {
  width: 96px; height: 96px; border-radius: 50%; display: block;
  border: 2px solid rgba(255, 255, 255, 0.72);
  box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.5), 0 8px 20px rgba(0, 0, 0, 0.5);
  background: #12151f;
}
#zone {
  font: 400 20px/1 var(--font-title); white-space: nowrap; letter-spacing: 0.07em; text-transform: uppercase; color: #fff;
  text-shadow: 0 2px 0 rgba(0, 0, 0, 0.55), 0 0 14px rgba(255, 150, 60, 0.6);
  opacity: 0; transition: opacity 0.5s;
}
#zone.show { opacity: 1; }

.topright { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
.brand { display: flex; flex-direction: column; align-items: flex-end; gap: 2px; min-width: 0; text-align: right; }
.brand b { font: 400 32px/0.95 var(--font-title); letter-spacing: 0.16em; color: var(--accent); text-shadow: 0 2px 0 rgba(0, 0, 0, 0.5), 0 0 16px rgba(255, 130, 40, 0.5); }
.brand span { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-shadow: 0 1px 6px #000; }

.pill {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
  font: 500 12px/1.2 var(--font-display);
  letter-spacing: 0.06em;
  display: flex; align-items: center; gap: 8px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  white-space: nowrap;
}
.pill i { width: 8px; height: 8px; border-radius: 50%; background: #5dffb0; box-shadow: 0 0 8px #5dffb0; }
.pill small { color: var(--muted); font: 400 11px var(--font-body); letter-spacing: 0; }

#toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 128px);
  transform: translateX(-50%);
  max-width: min(92vw, 420px);
  background: var(--panel);
  border: 1px solid var(--portal);
  color: var(--ink);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 14px; line-height: 1.35; text-align: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  pointer-events: none;
}
#toast b { font-family: var(--font-display); color: var(--portal); letter-spacing: 0.06em; }

#stick {
  pointer-events: auto; touch-action: none;
  position: relative; width: 124px; height: 124px; flex: none;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 255, 255, 0.10), rgba(16, 12, 36, 0.55));
  border: 1.5px solid var(--line);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
#knob {
  position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; border-radius: 50%;
  transform: translate(-50%, -50%);
  background: var(--accent); opacity: 0.88;
  box-shadow: 0 0 18px rgba(255, 179, 71, 0.55);
}

.right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; min-width: 0; }
.hint { font-size: 12px; color: var(--muted); text-align: right; max-width: 190px; line-height: 1.4; text-shadow: 0 1px 6px #000; }
.nick {
  pointer-events: auto; display: flex; align-items: center; gap: 6px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
  padding: 3px 6px 3px 12px;
  font: 500 11px/1 var(--font-display); letter-spacing: 0.08em; color: var(--muted);
}
.nick:focus-within { border-color: var(--accent); }
.nick input {
  width: 108px; background: transparent; border: 0; outline: none; text-align: right;
  color: var(--ink); font: 500 16px/1.2 var(--font-display); padding: 5px 8px;
  -webkit-user-select: text; user-select: text;
}
#swatches { pointer-events: auto; display: flex; gap: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; }
#swatches button {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; padding: 0; cursor: pointer;
  outline-offset: 2px;
}
#swatches button[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 10px rgba(246, 239, 228, 0.5); }
#swatches button:focus-visible { outline: 2px solid var(--portal); }

#chat[hidden] { display: none; }
#chat {
  position: fixed; left: max(12px, env(safe-area-inset-left, 0px));
  top: calc(env(safe-area-inset-top, 0px) + 150px);
  width: min(230px, 56vw); display: flex; flex-direction: column; gap: 6px; z-index: 5;
}
#chatLog {
  background: rgba(16, 12, 36, 0.5); border-radius: 12px; padding: 6px 10px;
  max-height: 22vh; overflow-y: auto; display: flex; flex-direction: column; gap: 3px;
  scrollbar-width: none; pointer-events: none;
}
#chatLog::-webkit-scrollbar { display: none; }
#chatLog:empty { display: none; }
.msg { font-size: 12.5px; line-height: 1.35; word-break: break-word; text-shadow: 0 1px 3px #000; }
.msg b { font-family: var(--font-display); font-weight: 600; }
.msg.sys { color: var(--muted); font-style: italic; }
#chatInputWrap { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 6px 4px 14px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
#chatInputWrap:focus-within { border-color: var(--accent); }
#chatInput { flex: 1; min-width: 0; background: transparent; border: 0; outline: none; color: var(--ink); font: 400 14px/1.2 var(--font-body); -webkit-user-select: text; user-select: text; }
#chatSend { width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; background: var(--accent); color: #1a1020; font: 600 14px var(--font-display); }
#nogl[hidden] { display: none; }
#nogl { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; background: var(--bg); color: var(--ink); line-height: 1.5; }

.actions { display: flex; gap: 10px; }
.actions button {
  pointer-events: auto; touch-action: none; cursor: pointer;
  width: 66px; height: 66px; border-radius: 50%;
  border: 1.5px solid var(--line); background: var(--panel); color: var(--ink);
  font: 600 11px/1.1 var(--font-display); letter-spacing: 0.06em; text-transform: uppercase;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.actions button.on { border-color: var(--accent); background: rgba(255, 179, 71, 0.25); box-shadow: 0 0 14px rgba(255, 179, 71, 0.45); }
#btnJump { border-color: var(--accent); color: var(--accent); }
.actions button:focus-visible { outline: 2px solid var(--portal); outline-offset: 2px; }
@media (min-width: 720px) { #stick, .actions { display: none; } .hint { max-width: 320px; } }
@media (pointer: coarse) { #stick { display: block; } .actions { display: flex; } }
</style>
</head>
<body>

<canvas id="c" aria-label="Ciudad de Paradixe, un mundo 3D al atardecer"></canvas>
<div id="vignette"></div>

<div id="top">
  <div class="left">
    <canvas id="radar" width="192" height="192" aria-label="Radar de la ciudad"></canvas>
    <div id="zone"></div>
  </div>
  <div class="topright">
    <div class="brand"><b>PARADIXE</b><span>Ciudad · versión 0.2</span></div>
    <div class="pill"><i></i><span id="count">1 en línea</span><small id="sub">modo solo</small></div>
  </div>
</div>
<div id="toast" hidden></div>
<div id="chat" hidden>
  <div id="chatLog" aria-live="polite"></div>
  <div id="chatInputWrap"><input id="chatInput" type="text" maxlength="120" autocomplete="off" placeholder="Chat cercano (18 m)"><button id="chatSend" type="button" aria-label="Enviar">↗</button></div>
</div>
<div id="bottom">
  <div id="stick" aria-label="Joystick para caminar"><div id="knob"></div></div>
  <div class="right">
    <div class="hint" id="hint">Arrastra la pantalla para mirar. Camina con el joystick.</div>
    <label class="nick" for="nick">TU NOMBRE<input id="nick" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div id="swatches" role="group" aria-label="Color de la camiseta"></div>
    <div class="actions"><button id="btnJump" type="button">Saltar</button><button id="btnCrouch" type="button">Agachar</button></div>
  </div>
</div>
<div id="nogl" hidden>Este dispositivo no pudo iniciar gráficos 3D (WebGL). Prueba abrir el enlace en Chrome.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  var TAU = Math.PI * 2;
  var canvas = document.getElementById('c');
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  } catch (err) {
    document.getElementById('nogl').hidden = false;
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
  var maxAniso = Math.min(4, renderer.capabilities.getMaxAnisotropy());

  var reduceMotion = false;
  try { reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}

  /* ---------- medidas de la ciudad ---------- */
  var BLOCK = 44, ROAD = 16, PITCH = 60, HALFW = 158, LIMIT = 156;
  var RC = [-150, -90, -30, 30, 90, 150];   /* centros de las calles, en x y en z */
  var SLAB = 0.14;                           /* altura de la acera */

  var FOG = 0xd9806a;
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(FOG);
  scene.fog = new THREE.FogExp2(FOG, 0.0027);
  var camera = new THREE.PerspectiveCamera(60, 1, 0.2, 900);

  scene.add(new THREE.HemisphereLight(0x9a8fd8, 0x55384a, 1.0));
  var SUN = new THREE.Vector3(-0.8, 0.2, -0.35).normalize();
  var sunLight = new THREE.DirectionalLight(0xffa968, 1.2);
  sunLight.position.copy(SUN).multiplyScalar(200);
  scene.add(sunLight);

  /* ---------- utilidades ---------- */
  function angDiff(a, b) {
    var d = (b - a) % TAU;
    if (d > Math.PI) d -= TAU;
    if (d < -Math.PI) d += TAU;
    return d;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = mulberry32(20261025);   /* la ciudad sale igual para todos los jugadores */
  function R(a, b) { return a + (b - a) * rnd(); }
  function pick(arr) { return arr[Math.floor(rnd() * arr.length)]; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

  function canvasTex(w, h, draw, rx, ry) {
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    draw(c.getContext('2d'), w, h);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.anisotropy = maxAniso;
    if (rx) t.repeat.set(rx, ry || rx);
    return t;
  }
  function label(text, opts) {
    opts = opts || {};
    var w = opts.w || 256, h = opts.h || 64;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var g = c.getContext('2d');
    if (opts.bg) { g.fillStyle = opts.bg; g.fillRect(0, 0, w, h); }
    g.font = (opts.weight || 600) + ' ' + (opts.px || 30) + 'px "Chakra Petch", "Trebuchet MS", sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillStyle = opts.color || '#f6efe4';
    g.fillText(text, w / 2, h / 2 + 2);
    var tex = new THREE.CanvasTexture(c);
    var mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, fog: false });
    var s = new THREE.Sprite(mat);
    var size = opts.size || 0.7;
    s.scale.set(size * (w / h), size, 1);
    return s;
  }

  var glowTex = canvasTex(64, 64, function (g) {
    var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(0.35, 'rgba(255,255,255,0.45)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  glowTex.wrapS = glowTex.wrapT = THREE.ClampToEdgeWrapping;
  var blobTex = canvasTex(64, 64, function (g) {
    var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(0,0,0,0.6)');
    gr.addColorStop(0.6, 'rgba(0,0,0,0.3)');
    gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  blobTex.wrapS = blobTex.wrapT = THREE.ClampToEdgeWrapping;

  /* Une muchas piezas en una sola malla: así la ciudad entera cuesta pocas llamadas de dibujo. */
  function Batch() { this.pos = []; this.nor = []; this.col = []; this.uv = []; }
  Batch.prototype.vert = function (x, y, z, nx, ny, nz, c, u, v) {
    this.pos.push(x, y, z); this.nor.push(nx, ny, nz); this.col.push(c.r, c.g, c.b); this.uv.push(u, v);
  };
  Batch.prototype.wall = function (ax, az, bx, bz, y0, y1, nx, nz, u0, u1, v0, v1, cLo, cHi) {
    this.vert(ax, y0, az, nx, 0, nz, cLo, u0, v0);
    this.vert(bx, y0, bz, nx, 0, nz, cLo, u1, v0);
    this.vert(bx, y1, bz, nx, 0, nz, cHi, u1, v1);
    this.vert(ax, y0, az, nx, 0, nz, cLo, u0, v0);
    this.vert(bx, y1, bz, nx, 0, nz, cHi, u1, v1);
    this.vert(ax, y1, az, nx, 0, nz, cHi, u0, v1);
  };
  Batch.prototype.flat = function (x0, z0, x1, z1, y, c) {
    this.vert(x0, y, z0, 0, 1, 0, c, 0, 0); this.vert(x0, y, z1, 0, 1, 0, c, 0, 1); this.vert(x1, y, z1, 0, 1, 0, c, 1, 1);
    this.vert(x0, y, z0, 0, 1, 0, c, 0, 0); this.vert(x1, y, z1, 0, 1, 0, c, 1, 1); this.vert(x1, y, z0, 0, 1, 0, c, 1, 0);
  };
  var _v = new THREE.Vector3(), _n = new THREE.Vector3(), _nm = new THREE.Matrix3();
  Batch.prototype.geo = function (geometry, matrix, color, colorFn) {
    var g = geometry.index ? geometry.toNonIndexed() : geometry;
    var p = g.attributes.position, n = g.attributes.normal;
    _nm.getNormalMatrix(matrix);
    for (var i = 0; i < p.count; i++) {
      _v.fromBufferAttribute(p, i).applyMatrix4(matrix);
      _n.fromBufferAttribute(n, i).applyMatrix3(_nm).normalize();
      this.vert(_v.x, _v.y, _v.z, _n.x, _n.y, _n.z, colorFn ? colorFn(_v) : color, 0, 0);
    }
  };
  Batch.prototype.build = function () {
    var g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(this.col, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.computeBoundingSphere();
    return g;
  };
  function addMesh(batch, material) {
    var m = new THREE.Mesh(batch.build(), material);
    scene.add(m);
    return m;
  }
  var M4 = new THREE.Matrix4(), M4b = new THREE.Matrix4(), M4c = new THREE.Matrix4(), EU = new THREE.Euler();
  function at(x, y, z) { return new THREE.Matrix4().makeTranslation(x, y, z); }
  function C(hex) { return new THREE.Color(hex); }

  /* ---------- cielo de atardecer ---------- */
  var sky = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 18), new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: {
      top: { value: C(0x1b1f5e) }, mid: { value: C(0xc4527f) }, hor: { value: C(FOG) },
      sunDir: { value: SUN.clone() }
    },
    vertexShader: 'varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }',
    fragmentShader: 'varying vec3 vDir; uniform vec3 top; uniform vec3 mid; uniform vec3 hor; uniform vec3 sunDir;' +
      'void main(){ float h = clamp(vDir.y, 0.0, 1.0); vec3 c = mix(hor, mid, smoothstep(0.0, 0.2, h));' +
      ' c = mix(c, top, smoothstep(0.16, 0.7, h)); float s = max(dot(normalize(vDir), normalize(sunDir)), 0.0);' +
      ' c += vec3(1.0, 0.55, 0.25) * pow(s, 14.0) * 0.55 + vec3(1.0, 0.8, 0.5) * pow(s, 90.0) * 0.6 + vec3(1.0, 0.95, 0.8) * pow(s, 1200.0) * 2.0;' +
      ' gl_FragColor = vec4(c, 1.0); }'
  }));
  sky.renderOrder = -10; sky.frustumCulled = false;
  scene.add(sky);

  var starPos = [];
  for (var si = 0; si < 700; si++) {
    var sth = Math.random() * TAU, sy = 0.32 + Math.random() * 0.68, sr = Math.sqrt(1 - sy * sy);
    starPos.push(Math.cos(sth) * sr * 640, sy * 640, Math.sin(sth) * sr * 640);
  }
  var starGeo = new THREE.BufferGeometry();
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
  var stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xfff2e0, size: 1.7, sizeAttenuation: false, fog: false, transparent: true, opacity: 0.7 }));
  stars.frustumCulled = false;
  sky.add(stars);
  var moon = new THREE.Mesh(new THREE.CircleGeometry(24, 40), new THREE.MeshBasicMaterial({ color: 0xf7efe0, fog: false }));
  moon.position.set(250, 300, 420);
  moon.lookAt(0, 0, 0);
  sky.add(moon);
  var moonHalo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: 0xffd9b0, transparent: true, opacity: 0.5, depthWrite: false, fog: false, blending: THREE.AdditiveBlending }));
  moonHalo.scale.set(150, 150, 1);
  moonHalo.position.copy(moon.position).multiplyScalar(0.99);
  sky.add(moonHalo);

  /* montañas lejanas, como los Andes entre la bruma */
  var mtn = new Batch(), mBase = C(0x2c2a58), mTip = C(0x6b5486), mTmp = C(0x000000);
  for (var mi = 0; mi < 40; mi++) {
    var ma = (mi / 40) * TAU + R(-0.08, 0.08), mr = R(340, 440), mh = R(40, 120), mrad = R(50, 100);
    var cone = new THREE.ConeGeometry(mrad, mh, 7, 1);
    cone.translate(0, mh / 2, 0);
    M4.makeRotationY(R(0, TAU)).setPosition(Math.cos(ma) * mr, -2, Math.sin(ma) * mr);
    (function (hh) {
      mtn.geo(cone, M4, null, function (v) { return mTmp.copy(mBase).lerp(mTip, clamp((v.y + 2) / hh, 0, 1)); });
    })(mh);
  }
  scene.add(new THREE.Mesh(mtn.build(), new THREE.MeshBasicMaterial({ vertexColors: true })));

  /* ---------- suelo, calles y aceras ---------- */
  var asphaltTex = canvasTex(256, 256, function (g, w, h) {
    g.fillStyle = '#3a3d4a'; g.fillRect(0, 0, w, h);
    for (var q = 0; q < 2600; q++) {
      var v = 50 + Math.floor(Math.random() * 40);
      g.fillStyle = 'rgba(' + v + ',' + v + ',' + (v + 10) + ',0.55)';
      g.fillRect(Math.random() * w, Math.random() * h, 2, 2);
    }
  }, 41, 41);
  var outer = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400), new THREE.MeshStandardMaterial({ color: 0x3b4a30, roughness: 1 }));
  outer.rotation.x = -Math.PI / 2; outer.position.y = -0.06;

    var dx2 = camFocus.x + Math.sin(yaw) * cp * dist, dy2 = camFocus.y + Math.sin(pitch) * dist, dz2 = camFocus.z + Math.cos(yaw) * cp * dist;
    var tc = clipCam(camFocus.x, camFocus.y, camFocus.z, dx2, dy2, dz2);
    var tcl = tc < 1 ? Math.max(tc - 0.03, 0.1) : 1;
    camera.position.set(camFocus.x + (dx2 - camFocus.x) * tcl, Math.max(0.5, camFocus.y + (dy2 - camFocus.y) * tcl), camFocus.z + (dz2 - camFocus.z) * tcl);
    camera.lookAt(camFocus);
    var wantFov = baseFov + (running ? 7 : 0);
    if (Math.abs(camera.fov - wantFov) > 0.05) { camera.fov += (wantFov - camera.fov) * Math.min(1, dt * 6); camera.updateProjectionMatrix(); }
    sky.position.copy(camera.position);
    lampMat.uniforms.scale.value = renderer.domElement.height / (2 * Math.tan(camera.fov * Math.PI / 360));

    updateBlobs();
    setZone(zoneAt(player.position.x, player.position.z));
    if (frameN % 2 === 0) drawRadar(player.position.x, player.position.z);

    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
